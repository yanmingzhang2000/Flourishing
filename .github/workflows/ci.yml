name: CI

on:
  push:
    branches: [rewrite]
  pull_request:
    branches: [rewrite]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Install Playwright browsers (only when e2e specs exist)
        if: hashFiles('tests/e2e/**/*.spec.ts') != ''
        run: pnpm exec playwright install --with-deps

      - name: E2E
        run: pnpm test:e2e
