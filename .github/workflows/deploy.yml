name: Deploy to Server

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Install server dependencies
        run: npm ci --prefix server

      - name: Build backend
        run: npm run build --prefix server

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p 22 $SERVER_HOST >> ~/.ssh/known_hosts 2>/dev/null
          echo "Key first line: $(head -1 ~/.ssh/deploy_key)"
          echo "Key last line: $(tail -1 ~/.ssh/deploy_key)"
          echo "Key lines: $(wc -l < ~/.ssh/deploy_key)"
          ls -la ~/.ssh/deploy_key
        env:
          SSH_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SERVER_HOST: ${{ secrets.SERVER_HOST }}

      - name: Test SSH connection
        run: |
          ssh -vvv -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no \
            ${{ secrets.DEPLOY_USER }}@${{ secrets.SERVER_HOST }} "echo SSH_OK"
        env:
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          SERVER_HOST: ${{ secrets.SERVER_HOST }}

      - name: Upload frontend
        run: |
          scp -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no \
            dist/index.html \
            ${{ secrets.DEPLOY_USER }}@${{ secrets.SERVER_HOST }}:${{ secrets.DEPLOY_PATH }}/dist/index.html

      - name: Upload backend
        run: |
          scp -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no -r \
            server/dist \
            ${{ secrets.DEPLOY_USER }}@${{ secrets.SERVER_HOST }}:${{ secrets.DEPLOY_PATH }}/server/
          scp -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no \
            server/package.json \
            ${{ secrets.DEPLOY_USER }}@${{ secrets.SERVER_HOST }}:${{ secrets.DEPLOY_PATH }}/server/package.json

      - name: Restart server
        run: |
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no \
            ${{ secrets.DEPLOY_USER }}@${{ secrets.SERVER_HOST }} \
            "cd ${{ secrets.DEPLOY_PATH }}/server && npm install --omit=dev 2>&1 | tail -3 && pm2 restart flourish-api && sleep 2 && curl -s http://localhost:80/api/health"

      - name: Cleanup SSH
        if: always()
        run: rm -rf ~/.ssh/deploy_key
