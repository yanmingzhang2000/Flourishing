services:
  server:
    build:
      context: .
      dockerfile: apps/server/Dockerfile
    container_name: flourish-server
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_PATH: /app/data/db/flourish.db
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set in .env}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost}
    volumes:
      # Persist SQLite database across container restarts
      - flourish-db:/app/data/db
    ports:
      - '3001:3000'
    healthcheck:
      test: ['CMD', 'wget', '--no-verbose', '--tries=1', '--spider', 'http://localhost:3000/health']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: flourish-web
    restart: unless-stopped
    depends_on:
      server:
        condition: service_healthy
    ports:
      - '80:80'

volumes:
  flourish-db:
    driver: local
